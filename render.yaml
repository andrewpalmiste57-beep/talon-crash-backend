services:
  - type: web
    name: talon-backend
    runtime: docker
    repo: https://github.com/your-org/talon
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talon-postgres
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: PHX_HOST
        value: talon-backend.onrender.com
      - key: PORT
        value: 4000
      - key: POOL_SIZE
        value: 10
    healthCheckPath: /api/health

  - type: web
    name: talonmaster-node
    runtime: node
    repo: https://github.com/your-org/talon
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: TALON_API_URL
        value: https://talon-backend.onrender.com

databases:
  - name: talon-postgres
    databaseName: talon_production
    user: talon
    plan: free
